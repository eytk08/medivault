<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDIVAULT</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/dbstyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div class="app-shell">
        <nav>
            <ul>
                <li>
                    <a href="#" class="logo">
                        <img src="assets/images/logo2.png" alt="Logo"> 
                        <span class="nav-item"></span>
                    </a>
                </li>
                <li>
                    <a href="user.dashboard.html"><i class="fas fa-tachometer-alt"></i> 
                        <span class="nav-item">Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="form.html"><i class="fas fa-file-alt"></i> 
                        <span class="nav-item">Form</span>
                    </a>
                </li>
                <li class="active">
                    <a href="settings.html"><i class="fas fa-cog"></i>
                        <span class="nav-item">Settings</span>
                    </a>
                </li>
                <li>
                    <a href="#" id="logoutLink" class="logout"><i class="fas fa-sign-out-alt"></i>
                        <span class="nav-item">Logout</span>
                    </a>
                </li>
            </ul>
        </nav>

        <section class="main-section">
            <div class="profile">
                <h1 class="header">Settings</h1>
                <div id="settingsAlert" class="alert d-none mx-4" role="alert"></div>
                <div class="content2">
                    <div class="left-column">
                        <h1 class="header2">Personal Information</h1>
                        <div class="mprofile">
                            <div class="input-container">
                                <label for="nameInput">Name</label>
                                <input type="text" id="nameInput" maxlength="60" disabled>
                            </div>
                            <div class="input-container">
                                <label for="birthdayInput">Birthday</label>
                                <input type="date" id="birthdayInput" disabled>
                            </div>
                            <div class="input-container">
                                <label for="sexInput">Sex</label>
                                <select id="sexInput" disabled>
                                    <option value="M">Male</option>
                                    <option value="F">Female</option>
                                </select>
                            </div>
                            <div class="input-container">
                                <label for="religionInput">Religion</label>
                                <input type="text" id="religionInput" maxlength="30" disabled>
                            </div>
                            <div class="input-container">
                                <label for="maritalStatusInput">Marital Status</label>
                                <select id="maritalStatusInput" disabled>
                                    <option value="single">Single</option>
                                    <option value="married">Married</option>
                                    <option value="separated">Separated</option>
                                    <option value="divorced">Divorced</option>
                                    <option value="widowed">Widowed</option>
                                </select>
                            </div>
                            <button class="btn btn-brand" id="personalEdit">Edit</button>
                            <button class="btn btn-outline-brand d-none" id="personalCancel">Cancel</button>
                        </div>
                    </div>
                    <div class="right-column">
                        <h1 class="header2">Account Information</h1>
                        <div class="sprofile">
                            <div class="input-container">
                                <label for="emailInput">Email</label>
                                <input type="email" id="emailInput" maxlength="100" disabled>
                            </div>
                            <div class="input-container">
                                <label for="phoneInput">Phone Number</label>
                                <input type="text" id="phoneInput" maxlength="20" disabled>
                            </div>
                            <div class="input-container d-none" id="passwordFields">
                                <label for="passwordInput">Current Password</label>
                                <input type="password" id="passwordInput" autocomplete="current-password">
                            </div>
                            <div class="input-container d-none" id="newPasswordFields">
                                <label for="newPasswordInput">New Password</label>
                                <input type="password" id="newPasswordInput" autocomplete="new-password" placeholder="optional">
                            </div>
                            <button class="btn btn-brand" id="accountEdit">Edit</button>
                            <button class="btn btn-outline-brand d-none" id="accountCancel">Cancel</button>
                            <button class="btn btn-brand-delete" id="deleteOpen">Delete account</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Delete account confirmation (Bootstrap modal) -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="deleteModalLabel">Delete your account?</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <p>This permanently deletes your login and your medical history. It cannot be undone.</p>
            <div id="deleteAlert" class="alert d-none" role="alert"></div>
            <label for="deletePassword" class="form-label">Enter your password to confirm</label>
            <input type="password" class="form-control" id="deletePassword" autocomplete="current-password">
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-brand-delete" id="deleteConfirm">Delete my account</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/site.js"></script>
    <script src="assets/js/settings.js"></script>
</body>
</html>
