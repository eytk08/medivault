<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDIVAULT</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/dbstyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div class="app-shell">
        <nav>
            <ul>
                <li>
                    <a href="#" class="logo">
                        <img src="assets/images/logo2.png" alt="Logo"> 
                        <span class="nav-item"></span>
                    </a>
                </li>
                <li class="active">
                    <a href="user.dashboard.html"><i class="fas fa-tachometer-alt"></i> 
                        <span class="nav-item">Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="form.html"><i class="fas fa-file-alt"></i> 
                        <span class="nav-item">Form</span>
                    </a>
                </li>
                <li>
                    <a href="settings.html"><i class="fas fa-cog"></i>
                        <span class="nav-item">Settings</span>
                    </a>
                </li>
                <li>
                    <a href="#" id="logoutLink" class="logout"><i class="fas fa-sign-out-alt"></i>
                        <span class="nav-item">Logout</span>
                    </a>
                </li>
            </ul>
        </nav>

        <section class="main">
            <div class="main-top">
                <h1>HELLO, <span id="greetName"></span></h1>
                <button class="btn btn-brand" id="editBtn">
                    <i class="fas fa-pen-square"></i> Edit
                </button>
            </div>

            <div id="dashAlert" class="alert d-none" role="alert"></div>
            <div id="loading" class="text-center my-5">
                <div class="spinner-border text-success" role="status"><span class="visually-hidden">Loading...</span></div>
            </div>

            <div id="dashContent" class="d-none">
            <div class="main-forms">
                <div class="card">
                    <i class="fa-solid fa-id-card-clip"></i>
                    <h1 class="patientid" id="patientId"></h1>
                    <h2>Patient ID</h2>
                </div>
                <div class="card">
                    <i class="fa-solid fa-stethoscope"></i>
                    <h1 id="doctorName"></h1>
                    <h3 id="doctorPhone"></h3>
                    <h3 id="doctorEmail"></h3>
                    <h2>PHYSICIAN</h2>
                </div>
                <div class="card">
                    <i class="fa-solid fa-droplet"></i>
                    <h1 class="blood" id="bloodType"></h1>
                    <h2>BLOOD TYPE</h2>
                </div>
                <div class="card">
                    <div class="column">
                        <div class="icons">
                            <i class="fa-solid fa-ruler-vertical"></i>
                            <i class="fa-solid fa-weight-scale"></i>
                        </div>
                        <div class="context">
                            <h1 class="hw" id="height"></h1>
                            <h3>Height</h3>
                            <h1 class="hw" id="weight"></h1>
                            <h3>Weight</h3>
                        </div>
                    </div>
                    <h2>MEASUREMENTS</h2>
                </div>
            </div>

            <div class="content-2">
                <section class="conditions">
                    <h1>Medical Conditions</h1>
                    <div class="conditions-box">
                        <div class="conditions-table">
                            <table>
                                <thead><tr><th>Condition Name</th><th>Diagnosis Date</th><th>Medications</th></tr></thead>
                                <tbody id="conditionsBody"></tbody>
                            </table>
                        </div>
                    </div>
                </section>
                <section class="allergies">
                    <h1>Allergies</h1>
                    <div class="allergies-box">
                        <div class="allergies-table">
                            <table>
                                <thead><tr><th>Allergens</th><th>Medications</th></tr></thead>
                                <tbody id="allergiesBody"></tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </div>
            <section class="surgeries">
                <h1>Surgeries</h1>
                <div class="surgeries-box">
                    <div class="surgeries-table">
                        <table>
                            <thead><tr><th>Surgery Type</th><th>Body Area</th><th>Date</th></tr></thead>
                            <tbody id="surgeriesBody"></tbody>
                        </table>
                    </div>
                </div>
            </section>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/site.js"></script>
    <script src="assets/js/dashboard.js"></script>
</body>
</html>
